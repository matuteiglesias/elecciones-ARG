<!DOCTYPE html>

   <body>

      <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.css" type="text/css">
      <div id="comparison-container">
         <div id="before" class="map"></div>
         <div id="after" class="map"></div>
      </div>

      <div id="menuleft">

            <option value="GRAL11n">Gral 2011</option>
            <option value="PASO13n">Paso 2013</option>

            <option value="PASO15n">Paso 2015</option>

            <option value="BLTG15n">Balotage 15</option>

            <option value="GRAL17n">Gral 2017</option>
            <option value="PASO19n">Paso 2019</option>
            <option value="GRAL19n" selected>Gral 2019</option>
            <option value="PASO21n">Paso 2021</option>
         </select>
         <select id="menu_cargo_tag_left">
            <option value="PR" selected>Presidente/a</option>
            <option value="DN">Dip. Nacs.</option>
         </select>
         <select id="menu_fuerza_left">
            <!-- Options will be dynamically added here -->

      <div id="menuright">
         <select id="menu_eleccion_tag_right">
            <option value="GRAL11n">Gral 2011</option>
            <option value="PASO13n">Paso 2013</option>
            <option value="GRAL13n">Gral 2013</option>
            <option value="PASO15n">Paso 2015</option>
            <option value="GRAL15n">Gral 2015</option>
            <option value="BLTG15n">Balotage 15</option>
            <option value="PASO17n">Paso 2017</option>
            <option value="GRAL17n">Gral 2017</option>
            <option value="PASO19n">Paso 2019</option>
            <option value="GRAL19n" selected>Gral 2019</option>
            <option value="PASO21n">Paso 2021</option>
         </select>
         <select id="menu_cargo_tag_right">
            <option value="PR" selected>Presidente/a</option>
            <option value="DN">Dip. Nacs.</option>
         </select>
         <select id="menu_fuerza_right">
            <option value="test" selected>TEST</option>
            <!-- Options will be dynamically added here -->
         </select>

      <script>
         // Fetch the style_info.json file
         fetch('./style_info.json')
         .then(response => response.json())
         .then(data => {
         // Assign the loaded data to the stylesMapping variable
         const stylesMapping = data;
         // {"BLTG15n_PR_POSITIVO_Cambiemos": {"style_id": "clkpu0fr701gv01p249mu9uf6"}, "BLTG15n_PR_POSITIVO_Frente Para La Victoria": {"style_id": "clkpu0gtu00uy01pj3b1tgzz5"}}
         
         
         
         mapboxgl.accessToken = 'pk.eyJ1IjoibWF0dXRlaWdsZXNpYXMyIiwiYSI6ImNrbzgxNmlpcjFqMHoydXBkczlpNWZjOWwifQ.0rO8qjKulnRvNknh_h29NA';
         const beforeMap = new mapboxgl.Map({
          container: 'before',
          // Choose from Mapbox's core styles, or make your own style with Mapbox Studio
          style: 'mapbox://styles/matuteiglesias2/clkrc0ypu011v01qk05s63hj5',
          center: [0, 0],
          zoom: 0
         });
         
         const afterMap = new mapboxgl.Map({
          container: 'after',
          style: 'mapbox://styles/matuteiglesias2/clkrc0zh001o701p24ttrb9gs',
          center: [0, 0],
          zoom: 0
         });
         
         
         // A selector or reference to HTML element
         const container = '#comparison-container';
         
         const map = new mapboxgl.Compare(beforeMap, afterMap, container, {
          // Set this to enable comparing two maps by mouse movement:
          // mousemove: true
         });
         
         
         function updateMapStyle() {
         // JavaScript variable names:
         const menu_eleccion_tag_left = document.getElementById('menu_eleccion_tag_left');
         const menu_cargo_tag_left = document.getElementById('menu_cargo_tag_left');
         const menu_fuerza_left = document.getElementById('menu_fuerza_left');
         
         const menu_eleccion_tag_right = document.getElementById('menu_eleccion_tag_right');
         const menu_cargo_tag_right = document.getElementById('menu_cargo_tag_right');
         const menu_fuerza_right = document.getElementById('menu_fuerza_right');
         
         const selectedEleccion_left = menu_eleccion_tag_left.value;
         const selectedCargo_left = menu_cargo_tag_left.value;
         const selectedFuerza_left = menu_fuerza_left.value;
         
         const selectedEleccion_right = menu_eleccion_tag_right.value;
         const selectedCargo_right = menu_cargo_tag_right.value;
         const selectedFuerza_right = menu_fuerza_right.value;
         
         // Define the styles mapping for the left and right maps
         
         const valido = 'POSITIVO'
         const styleKey_left = `${selectedEleccion_left}_${selectedCargo_left}_${valido}_${selectedFuerza_left}`;
         const styleKey_right = `${selectedEleccion_right}_${selectedCargo_right}_${valido}_${selectedFuerza_right}`;
         
         let beforeStyle = 'mapbox://styles/matuteiglesias2/clkrc0ypu011v01qk05s63hj5';
         let afterStyle = 'mapbox://styles/matuteiglesias2/clkrc0zh001o701p24ttrb9gs';
         
         let styleId_left;  // added this line
	 let styleId_right; // added this line
         
	  if (stylesMapping.hasOwnProperty(styleKey_left)) {
	    styleId_left = stylesMapping[styleKey_left].style_id;
	    beforeStyle = `mapbox://styles/matuteiglesias2/${styleId_left}`;
	  }

	  if (stylesMapping.hasOwnProperty(styleKey_right)) {
	    styleId_right = stylesMapping[styleKey_right].style_id;
	    afterStyle = `mapbox://styles/matuteiglesias2/${styleId_right}`;
	  }
	  
         console.log(styleKey_left)
         console.log(styleId_left)
         console.log(styleKey_right)
         console.log(styleId_right)
         beforeMap.setStyle(beforeStyle);
         afterMap.setStyle(afterStyle);
         
         console.log('updateMapStyle function called');
         console.log('Selected values:');
         console.log('Eleccion Left:', selectedEleccion_left);
         console.log('Cargo Left:', selectedCargo_left);
         console.log('Fuerza Left:', selectedFuerza_left);
         console.log('Eleccion Right:', selectedEleccion_right);
         console.log('Cargo Right:', selectedCargo_right);
         console.log('Fuerza Right:', selectedFuerza_right);
         console.log('beforeStyle:', beforeStyle);
         console.log('afterStyle:', afterStyle);
         }
         
         const menu_eleccion_tag_left = document.getElementById('menu_eleccion_tag_left');
         const menu_cargo_tag_left = document.getElementById('menu_cargo_tag_left');
         const menu_fuerza_left = document.getElementById('menu_fuerza_left');
         
         // Event listeners:
         menu_eleccion_tag_left.addEventListener('change', updateMapStyle);
         menu_cargo_tag_left.addEventListener('change', updateMapStyle);
         menu_fuerza_left.addEventListener('change', updateMapStyle);
         
         
         const menu_eleccion_tag_right = document.getElementById('menu_eleccion_tag_right');
         const menu_cargo_tag_right = document.getElementById('menu_cargo_tag_right');
         const menu_fuerza_right = document.getElementById('menu_fuerza_right');
         
         menu_eleccion_tag_right.addEventListener('change', updateMapStyle);
         menu_cargo_tag_right.addEventListener('change', updateMapStyle);
         menu_fuerza_right.addEventListener('change', updateMapStyle);
         
         
         // Function to update the fuerza options in the menu
         function updateFuerzaOptions() {
         // Get the selected values of election and cargo tags
         const electionTagLeft = document.getElementById("menu_eleccion_tag_left").value;
         const cargoTagLeft = document.getElementById("menu_cargo_tag_left").value;
         const electionTagRight = document.getElementById("menu_eleccion_tag_right").value;
         const cargoTagRight = document.getElementById("menu_cargo_tag_right").value;
         
         // Get the fuerzas that appear in the stylesMapping based on the selected election and cargo tags
         const fuerzasLeft = getFuerzas(stylesMapping, electionTagLeft, cargoTagLeft);
         const fuerzasRight = getFuerzas(stylesMapping, electionTagRight, cargoTagRight);
         
         // Get the menu_fuerza_left and menu_fuerza_right elements
         const menuFuerzaLeft = document.getElementById("menu_fuerza_left");
         const menuFuerzaRight = document.getElementById("menu_fuerza_right");
         
         // Clear the current options in the fuerza menus
         menuFuerzaLeft.innerHTML = "";
         menuFuerzaRight.innerHTML = "";
         
         // Function to add an option to the fuerza menu
         function addOption(menu, value, text) {
         const option = document.createElement("option");
         option.value = value;
         option.text = text;
         menu.appendChild(option);
         }
         
         // Add the fuerza options to the menus
         fuerzasLeft.forEach(fuerza => {
         addOption(menuFuerzaLeft, fuerza, fuerza);
         });
         
         fuerzasRight.forEach(fuerza => {
         addOption(menuFuerzaRight, fuerza, fuerza);
         });
         }
         
         // Function to extract the fuerzas from stylesMapping based on the selected election and cargo tags
         function getFuerzas(stylesMapping, electionTag, cargoTag) {
         console.log("electionTag:", electionTag);
         console.log("cargoTag:", cargoTag);
         
         const fuerzas = new Set();
         for (const key in stylesMapping) {
         const [election, cargo, votos_tipo, fuerza] = key.split("_");
         console.log("key:", key);
         console.log("election:", election);
         console.log("cargo:", cargo);
         console.log("fuerza:", fuerza);
         // BLTG15n_PR_POSITIVO_Cambiemos
         
         if (election === electionTag && cargo === cargoTag) {
         fuerzas.add(fuerza);
         }
         }
         console.log("fuerzas:", Array.from(fuerzas));
         return Array.from(fuerzas);
         }
         // Call the function to update the fuerza options initially
         updateFuerzaOptions();
         
         // Add event listeners to the election and cargo tag menus to update the fuerza options on change
         document.getElementById("menu_eleccion_tag_left").addEventListener("change", updateFuerzaOptions);
         document.getElementById("menu_cargo_tag_left").addEventListener("change", updateFuerzaOptions);
         document.getElementById("menu_eleccion_tag_right").addEventListener("change", updateFuerzaOptions);
         document.getElementById("menu_cargo_tag_right").addEventListener("change", updateFuerzaOptions);
         
         
         })
         .catch(error => {
         console.error('Error loading style_info.json:', error);
         });
         
         
         
         
         
      </script>
   </body>
</html>
